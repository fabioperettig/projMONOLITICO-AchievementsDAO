services:
  postgres-test:
    image: postgres:15

    environment:
      POSTGRES_DB: achievement_test
      POSTGRES_USER: teste
      POSTGRES_PASSWORD: teste

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teste -d achievement_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  wildfly:
    command:
      - /opt/jboss/wildfly/bin/standalone.sh
      - -b
      - 0.0.0.0
      - -bmanagement
      - 0.0.0.0

    ports:
      - "127.0.0.1:9990:9990"

    depends_on:
      postgres-test:
        condition: service_healthy