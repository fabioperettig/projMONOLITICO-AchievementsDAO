<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      lang="pt-BR">

<h:head>
    <title>Cadastro de conquistas</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</h:head>

<h:body>
    <h1>Conquistas</h1>
    <p:button outcome="users" value="Usuários" icon="pi pi-users"/>

    <p:messages id="messages" showDetail="false" closable="true"/>

    <!-- FORMULÁRIO -->
    <h:form id="achievementForm">
        <p:panel header="#{achievementController.editing ? 'Editar conquista' : 'Registrar conquista'}">
            <p:panelGrid columns="2" layout="tabular">

                <p:outputLabel for="titulo" value="Título:"/>
                <p:inputText id="titulo"
                             value="#{achievementController.achievement.titulo}"
                             required="true"
                             requiredMessage="Informe o título."/>

                <p:outputLabel for="descricao" value="Descrição:"/>
                <p:inputTextarea id="descricao"
                                 value="#{achievementController.achievement.descricao}"
                                 rows="4"
                                 cols="40"
                                 autoResize="false"
                                 required="true"
                                 requiredMessage="Informe a descrição."/>

                <p:outputLabel for="dataConquista" value="Data:"/>
                <p:datePicker id="dataConquista"
                              value="#{achievementController.achievement.dataConquista}"
                              pattern="dd/MM/yyyy"
                              locale="pt_BR"
                              showIcon="true"
                              required="true"
                              requiredMessage="Informe a data."
                              converterMessage="Informe uma data válida."/>

                <p:outputLabel for="usuario" value="Usuário:"/>
                <p:selectOneMenu id="usuario"
                                 value="#{achievementController.achievement.user}"
                                 converter="userConverter"
                                 required="true"
                                 requiredMessage="Selecione um usuário.">

                    <f:selectItem itemLabel="Selecione..."
                                  itemValue="#{null}"
                                  noSelectionOption="true"/>

                    <f:selectItems value="#{achievementController.users}"
                                   var="usuario"
                                   itemLabel="#{usuario.apelido}"
                                   itemValue="#{usuario}"/>
                </p:selectOneMenu>

                <p:outputLabel for="privado" value="Privada:"/>
                <p:selectBooleanCheckbox id="privado"
                                         value="#{achievementController.achievement.privado}"/>

            </p:panelGrid>
            <p:divider/>

            <p:commandButton value="Cadastrar" icon="pi pi-plus"
                             action="#{achievementController.create}"
                             rendered="#{not achievementController.editing}"
                             ajax="false"/>

            <p:commandButton value="Salvar alteração" icon="pi pi-check"
                             action="#{achievementController.update}"
                             rendered="#{achievementController.editing}" ajax="false"/>

            <p:commandButton value="Cancelar" icon="pi pi-times" styleClass="ui-button-secondary"
                             action="#{achievementController.cancel}" process="@this" update="@form :messages" resetValues="true"/>
        </p:panel>
    </h:form>

    <h2>Conquistas cadastradas</h2>

    <!-- TABELA -->
    <h:form id="achievementsTableForm">
        <p:dataTable value="#{achievementController.achievements}"
                     var="item"
                     paginator="true" rows="10"
                     paginatorPosition="bottom" paginatorAlwaysVisible="false"
                     reflow="true"
                     emptyMessage="Nenhuma conquista cadastrada.">

            <p:column headerText="ID">
                <h:outputText value="#{item.id}"/>
            </p:column>

            <p:column headerText="Título">
                <h:outputText value="#{item.titulo}"/>
            </p:column>

            <p:column headerText="Descrição">
                <h:outputText value="#{item.descricao}"/>
            </p:column>

            <p:column headerText="Data">
                <h:outputText value="#{item.dataConquista}">
                    <f:convertDateTime type="localDate"
                                       pattern="dd/MM/yyyy"/>
                </h:outputText>
            </p:column>

            <p:column headerText="Usuário">
                <h:outputText value="#{item.user.apelido}"/>
            </p:column>

            <p:column headerText="Visibilidade">
                <p:tag value="#{item.privado ? 'Privada' : 'Pública'}"
                       severity="#{item.privado ? 'warning' : 'success'}"/>
            </p:column>

            <p:column headerText="Ações">

                <p:commandButton value="Editar" icon="pi pi-pencil" styleClass="ui-button-secondary"
                                 action="#{achievementController.edit(item)}" process="@this" update=":achievementForm :messages" resetValues="true"/>

                <p:commandButton value="Excluir" icon="pi pi-trash" styleClass="ui-button-danger"
                                 action="#{achievementController.delete(item)}" ajax="false"/>
            </p:column>

        </p:dataTable>
    </h:form>
</h:body>

</html>
